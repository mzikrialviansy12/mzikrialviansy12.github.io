<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 515">
  <rect width="820" height="515" fill="#ffffff"/>

  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#374151"/>
    </marker>
    <marker id="arw-red" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== main guest flow (left to right) ===== -->
  <line x1="210" y1="75" x2="280" y2="75" stroke="#374151" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="460" y1="75" x2="540" y2="75" stroke="#374151" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Mikrotik -> Mikhmon (captive portal check) -->
  <line x1="630" y1="110" x2="630" y2="210" stroke="#374151" stroke-width="2" marker-end="url(#arw)"/>
  <text x="642" y="165" font-family="sans-serif" font-size="11" fill="#6f6a64">voucher check</text>

  <!-- Mikrotik -> VLAN 10 Guest -->
  <line x1="540" y1="110" x2="468" y2="203" stroke="#374151" stroke-width="2" marker-end="url(#arw)"/>
  <text x="514" y="150" font-family="sans-serif" font-size="11" fill="#6f6a64">allow</text>

  <!-- VLAN 10 Guest -> Internet -->
  <line x1="370" y1="280" x2="370" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#arw)"/>
  <text x="380" y="335" font-family="sans-serif" font-size="11" fill="#6f6a64">NAT · outbound</text>

  <!-- Internal (VLAN 1) -> Mikrotik : trusted, routed around -->
  <polyline points="120,280 120,480 770,480 770,75 720,75"
            fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arw)"/>
  <text x="452" y="472" font-family="sans-serif" font-size="11" fill="#6f6a64">VLAN 1 · trusted</text>

  <!-- ===== isolation barrier: guest <-> internal (blocked) ===== -->
  <line x1="210" y1="245" x2="280" y2="245" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="238" y1="238" x2="252" y2="252" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="252" y1="238" x2="238" y2="252" stroke="#dc2626" stroke-width="2.5"/>
  <text x="245" y="270" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#dc2626">blocked</text>

  <!-- ===== boxes ===== -->
  <!-- Guest Devices -->
  <rect x="30" y="40" width="180" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="120" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#111111">Guest Devices</text>
  <text x="120" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6f6a64">Phone · Laptop</text>

  <!-- TP-Link Omada AP -->
  <rect x="280" y="40" width="180" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="370" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#111111">TP-Link Omada AP</text>
  <text x="370" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6f6a64">SSID · Guest WiFi</text>

  <!-- Mikrotik Router -->
  <rect x="540" y="40" width="180" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#111111">Mikrotik Router</text>
  <text x="630" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6f6a64">VLAN trunk · DHCP</text>

  <!-- Internal Network -->
  <rect x="30" y="210" width="180" height="70" rx="8" fill="#faf9f6" stroke="#111111" stroke-width="2"/>
  <text x="120" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#111111">Internal Network</text>
  <text x="120" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6f6a64">VLAN 1 · Trusted</text>

  <!-- VLAN 10 Guest -->
  <rect x="280" y="210" width="180" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="370" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#111111">VLAN 10 · Guest</text>
  <text x="370" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6f6a64">Isolated subnet</text>

  <!-- Mikhmon Portal -->
  <rect x="540" y="210" width="180" height="70" rx="8" fill="#fff4ed" stroke="#ff5a1f" stroke-width="2"/>
  <text x="630" y="238" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#111111">Mikhmon Portal</text>
  <text x="630" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6f6a64">Captive · Voucher Auth</text>

  <!-- Internet -->
  <rect x="280" y="380" width="180" height="70" rx="8" fill="#f5f5f4" stroke="#6f6a64" stroke-width="2"/>
  <text x="370" y="408" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#111111">Internet</text>
  <text x="370" y="428" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6f6a64">Upstream · NAT</text>
</svg>
